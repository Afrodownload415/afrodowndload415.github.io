
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test</title>
<style>
body{margin:0;background:#0a0806;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
h1{color:#ffd966;font-size:2.5rem}
button{margin-top:20px;padding:20px 50px;background:linear-gradient(135deg,#f5b400,#ffd966);border:none;border-radius:100px;font-size:20px;font-weight:900;color:#0a0806;cursor:pointer}
#app{display:none}
</style>
</head>
<body>
<div id="splash">
<h1>AfroDownload</h1>
<p style="color:#b8a87a">Splash loaded ✅</p>
<button onclick="launch()">Launch App</button>
</div>
<div id="app">
<h1>🎧</h1>
<h2 style="color:#ffd966">IT WORKS!</h2>
<p style="color:#b8a87a;margin-top:10px">The full app will work too.</p>
</div>
<script>
function launch(){
  document.getElementById('splash').style.display='none';
  document.getElementById('app').style.display='block';
}
</script>
</body>
</html>
