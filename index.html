<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Player Redesign</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --surface: #1a1a1a;
            --primary-yellow: #ffd000;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --slider-bg: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* Mobile App Container */
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            /* Optional: subtle border to show device bounds on desktop */
            border: 1px solid #333; 
        }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: flex-end;
            padding: 24px;
            z-index: 10;
        }

        .close-btn {
            background: rgba(255, 208, 0, 0.1);
            color: var(--primary-yellow);
            border: 1px solid rgba(255, 208, 0, 0.3);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 208, 0, 0.2);
        }

        /* --- Main Player Area --- */
        .player-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 24px;
            overflow-y: auto;
        }

        /* Artwork */
        .artwork-container {
            display: flex;
            justify-content: center;
            margin: 10px 0 30px;
        }

        .artwork {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 208, 0, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            /* Placeholder gradient if image fails */
            background: linear-gradient(45deg, #444, #888);
        }

        /* Track Info */
        .track-info {
            text-align: center;
            margin-bottom: 25px;
        }

        .track-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 1rem;
            color: var(--primary-yellow);
            font-weight: 500;
        }

        /* --- Secondary Controls (Like, Shuffle, Repeat) --- */
        .secondary-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        .secondary-controls i {
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .secondary-controls i.active {
            color: var(--primary-yellow);
        }

        /* --- Progress Bar --- */
        .progress-section {
            margin-bottom: 25px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--slider-bg);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            width: 45%; /* Set current progress here */
            background-color: var(--primary-yellow);
            border-radius: 3px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .progress-knob {
            width: 14px;
            height: 14px;
            background-color: var(--primary-yellow);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 45%; /* Match fill width */
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(255, 208, 0, 0.5);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* --- Primary Controls (Play, Skip) --- */
        .primary-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 30px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .play-pause-btn {
            width: 75px;
            height: 75px;
            background-color: var(--primary-yellow);
            color: var(--bg-dark);
            border-radius: 50%;
            font-size: 2rem;
            box-shadow: 0 8px 20px rgba(255, 208, 0, 0.3);
        }

        /* --- Utility Controls (Bottom Row) --- */
        .utility-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .utility-controls i {
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            background-color: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
            border-top: 1px solid #2a2a2a;
            border-radius: 20px 20px 0 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .nav-item.active {
            color: var(--primary-yellow);
        }

        .nav-item:hover {
            color: var(--text-main);
        }

        /* Hide scrollbar for clean UI */
        .player-main::-webkit-scrollbar {
            display: none;
        }
        .player-main {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <div class="header">
            <div class="close-btn">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>

        <!-- Main Player Content -->
        <div class="player-main">
            
            <!-- Artwork -->
            <div class="artwork-container">
                <!-- Using a placeholder image -->
                <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500&auto=format&fit=crop" alt="Album Artwork" class="artwork">
            </div>

            <!-- Track Info -->
            <div class="track-info">
                <div class="track-title">Waiting for you (feat. Naledi)</div>
                <div class="track-artist">Yungee</div>
            </div>

            <!-- Secondary Controls -->
            <div class="secondary-controls">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-solid fa-shuffle active"></i>
                <i class="fa-solid fa-repeat"></i>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-bar-container">
                    <div class="progress-fill"></div>
                    <div class="progress-knob"></div>
                </div>
                <div class="time-info">
                    <span>1:04</span>
                    <span>2:06</span>
                </div>
            </div>

            <!-- Primary Controls -->
            <div class="primary-controls">
                <button class="control-btn">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="control-btn play-pause-btn">
                    <i class="fa-solid fa-pause"></i>
                </button>
                <button class="control-btn">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

            <!-- Utility Controls -->
            <div class="utility-controls">
                <i class="fa-solid fa-download"></i>
                <i class="fa-solid fa-share-nodes"></i>
                <i class="fa-solid fa-list-ul"></i>
                <i class="fa-solid fa-volume-high"></i>
            </div>

        </div> <!-- End Main Player -->

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Search</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-bookmark"></i>
                <span>Library</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>You</span>
            </a>
        </div>

    </div>

</body>
</html>
